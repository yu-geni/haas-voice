name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR のビルドなどにはリポジトリへの書き込み権限を渡さない。Release の更新は publish ジョブだけが行う
permissions:
  contents: read

env:
  SHERPA_ONNX_VERSION: v1.13.6

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=$(gh release view "$SHERPA_ONNX_VERSION" -R k2-fsa/sherpa-onnx --json assets \
            -q '.assets[].name' | grep -E '^sherpa-onnx-v[0-9.]+-android\.tar\.bz2$' | head -1)
          echo "asset: $asset"
          gh release download "$SHERPA_ONNX_VERSION" -R k2-fsa/sherpa-onnx -p "$asset" -D /tmp/sherpa
          mkdir -p /tmp/sherpa/x && tar xjf "/tmp/sherpa/$asset" -C /tmp/sherpa/x
          so_dir=$(dirname "$(find /tmp/sherpa/x -path '*arm64-v8a*' -name 'libsherpa-onnx-jni.so' | head -1)")
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$so_dir"/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Fetch sherpa-onnx Kotlin API
        run: |
          git clone --depth 1 --branch "$SHERPA_ONNX_VERSION" --filter=blob:none --sparse \
            https://github.com/k2-fsa/sherpa-onnx /tmp/sherpa-src
          git -C /tmp/sherpa-src sparse-checkout set sherpa-onnx/kotlin-api
          dest=app/src/main/java/com/k2fsa/sherpa/onnx
          mkdir -p "$dest"
          cp /tmp/sherpa-src/sherpa-onnx/kotlin-api/*.kt "$dest"/
          ls "$dest"

      - name: Prepare signing key
        id: signing
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Using the signing key from GitHub Secrets"
          fi

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: haas-voice-input-apk
          path: app/build/outputs/apk/release/*.apk

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Skip unsigned builds
        if: needs.build.outputs.signed != 'true'
        # 署名鍵が登録されていないビルドは毎回違う鍵になり上書き更新できないので、公開しない
        run: echo "::warning::SIGNING_KEYSTORE_B64 が未登録のため、Release は更新しません"

      - uses: actions/download-artifact@v4
        if: needs.build.outputs.signed == 'true'
        with:
          name: haas-voice-input-apk
          path: apk

      - name: Publish "latest" release
        if: needs.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-release.apk haas-voice-input.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest haas-voice-input.apk --target "$GITHUB_SHA" \
            --title "最新ビルド (#${GITHUB_RUN_NUMBER})" \
            --notes "main ブランチの最新コードから自動ビルドしたAPKです。" --latest
